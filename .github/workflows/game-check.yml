name: Revisao automatica do jogo
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verificar sintaxe JavaScript embutido
        run: |
          python3 - <<'PY'
          import re
          html = open('index.html', encoding='utf-8').read()
          scripts = re.findall(r'<script>([\\s\\S]*?)</script>', html)
          if not scripts:
              raise SystemExit('Nenhum script JavaScript clássico encontrado')
          for i, script in enumerate(scripts):
              open(f'/tmp/inline-{i}.js', 'w', encoding='utf-8').write(script)
          print(f'{len(scripts)} script(s) extraído(s)')
          PY
          for f in /tmp/inline-*.js; do node --check "$f"; done
      - name: Verificar arquivos GLB e licenças
        run: |
          python3 - <<'PY'
          import os, struct
          paths = ['assets/3d/character-male-a.glb', 'assets/3d/fps-arms.glb', 'assets/3d/assault-rifle.glb']
          for path in paths:
              if not os.path.isfile(path): raise SystemExit(f'Falta asset: {path}')
              with open(path, 'rb') as f: header = f.read(12)
              if header[:4] != b'glTF': raise SystemExit(f'GLB inválido: {path}')
              version, length = struct.unpack('<II', header[4:12])
              actual = os.path.getsize(path)
              if version != 2 or length != actual: raise SystemExit(f'Cabeçalho GLB inconsistente: {path}')
              print(f'OK {path}: {actual} bytes')
          licenses = open('assets/3d/ASSET-LICENSES.md', encoding='utf-8').read()
          for term in ['CC0', 'Kenney', 'WRAD ARMS', 'Flat Guns East']:
              if term not in licenses: raise SystemExit(f'Licença/fonte ausente: {term}')
          print('Licenças e fontes presentes')
          PY
